<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Terminal</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        /* From theme.ts, handed over by renderer.ts (CSS can't import).
           The page must paint this itself: Chromium puts its own canvas
           behind every page, so the window's backgroundColor does NOT show
           through a background-less page. */
        background: var(--background);
        /* Tell Chromium this page is dark, so anything it draws itself
           (like scrollbars) uses its dark variant */
        color-scheme: dark;
      }
      #terminal {
        height: 100%;
        padding: 4px;
        box-sizing: border-box;
      }
      /* xterm's scrollback lives in a scrollable div (.xterm-viewport), and
         Chromium gives it a wide default scrollbar. Restyle it into a slim
         translucent thumb, like a native macOS overlay scrollbar. */
      .xterm-viewport::-webkit-scrollbar {
        width: 6px;
      }
      .xterm-viewport::-webkit-scrollbar-track {
        background: transparent;
      }
      /* The colors are custom properties set by renderer.ts from theme.ts —
         CSS has no way to read a script's values, so the script pushes them
         in. */
      .xterm-viewport::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 3px;
      }
      .xterm-viewport::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <!-- type="module" lets renderer.js use import (it imports theme.js).
         The xterm tags above stay classic scripts providing globals. -->
    <script type="module" src="../dist/renderer.js"></script>
  </body>
</html>
